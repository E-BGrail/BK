<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무차량관리</title>
<script>
/* 업무차량관리는 e-싸인(sign.html) 안의 화면으로 합침 (원본: src/car/, node build.js로 sign.html에 들어감).
   이 주소는 예전 링크·차량 QR(car.html?car=차량번호)용: 주소 뒤를 그대로 sign.html로 넘김. 주소만 열면 차량 목록(?car) */
location.replace('sign.html' + (location.search || '?car') + location.hash);
</script>
</head>
<body>
<noscript><a href="sign.html?car">업무차량관리로 이동</a></noscript>
</body>
</html>
